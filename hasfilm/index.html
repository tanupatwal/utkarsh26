<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utkarsh 2026 — The Festival</title>

  <!-- Preconnect to font servers for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Google Fonts: Option C cutting-edge stack -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&family=Eczar:wght@500;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400&family=Inconsolata:wght@400;700&family=Josefin+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />


  <style>
    /* Clash Display Font */
    @font-face {
      font-family: 'Clash Display';
      src: url('/assets/fonts/ClashDisplay-Bold.otf');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Clash Display';
      src: url('/assets/fonts/ClashDisplay-Semibold.otf');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #000;
      font-family: var(--font-body);
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #000;
    }

    #root {
      width: 100%;
    }

    /* Custom scrollbar hide */
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }

    .wisp-text {
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity, filter, letter-spacing;
    }

    /* Gallery HUD text crossfade */
    @keyframes galleryFadeIn {
      0% {
        opacity: 0;
        transform: translateY(12px);
        filter: blur(4px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .gallery-text-enter {
      animation: galleryFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0",
    "three": "https://esm.sh/three@^0.182.0",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7"
  }
}
</script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
